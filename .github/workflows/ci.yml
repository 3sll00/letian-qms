name: CI Quality Gate

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  quality-gate:
    name: Typecheck, Lint & Contract Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: letian_user
          POSTGRES_PASSWORD: letian_secure_pass_2026
          POSTGRES_DB: letian_qms_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.0.0
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Strict Typecheck (Project References)
        run: pnpm typecheck

      - name: Run ESLint
        run: pnpm lint

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql://letian_user:letian_secure_pass_2026@localhost:5432/letian_qms_db?schema=public
        run: pnpm db:migrate

      - name: Run Automated Tests
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://letian_user:letian_secure_pass_2026@localhost:5432/letian_qms_db?schema=public
          # MRB 不合格数量白盒对账（docs/49 §8.3）：豁免零容忍 —— 当前 0 豁免故设 0；
          # 一旦出现豁免，先判定是数据问题还是口径问题，再决定是否放宽该阈值。
          MRB_PARITY_EXEMPT_MAX: "0"
        run: pnpm test

      - name: Run OpenAPI Contract Conformance Check
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://letian_user:letian_secure_pass_2026@localhost:5432/letian_qms_db?schema=public
          # CI 空库设 0（允许 0 单空转，规格自检+离线可证伪性仍必跑）；有数据的库建议设 1
          OPENAPI_CONFORMANCE_MIN_CASES: "0"
          # 已知漂移登记上限：当前 1 处（KD-01 看板统计口径漂移），防止新漂移静默塞入
          OPENAPI_KNOWN_DRIFT_MAX: "1"
        run: pnpm verify:openapi
