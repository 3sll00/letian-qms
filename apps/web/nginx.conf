# 乐天 QMS 前端站点（docker-compose.prod.yml 中的 web 服务）
#
# - 静态产物由 apps/web/dist 提供，SPA 回退到 /index.html
# - /api/* 反代到 compose 网络内的 api 服务（服务名即上游主机名，改服务名需同步改这里）
# - 桌面客户端不经本站：它由「服务器设置」直连 api 端口

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 方案 Excel 导入上限 10MB（@fastify/multipart 限制），网关留余量
    client_max_body_size 50m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    # Compose/Docker 内嵌 DNS。变量形式 proxy_pass 会在请求期解析，
    # api 容器重建更换 IP 后 web 不需要跟着重建。
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $api_upstream http://api:3100;
    set $api_health_upstream http://api:3100/health;

    # 后端 API：保留真实来源 IP，便于审计日志记录操作者来源
    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 探活直通后端（compose healthcheck / 外部探针用）
    location = /health {
        proxy_pass $api_health_upstream;
        proxy_set_header Host $host;
    }

    # 指纹化静态资源长缓存（vite 产物文件名带内容哈希）
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # SPA：所有非文件路径回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
