appId: com.letian.qms.desktop
productName: 云亿QMS工作台
copyright: Copyright © 2026 Letian Fastener
electronDist: node_modules/electron/dist
directories:
  output: release
files:
  - out/**
  - web-dist/**
win:
  signAndEditExecutable: false
  target:
    - dir
    - nsis
    - portable
  artifactName: YunyiQMS-Desktop-${version}.${ext}
nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: 云亿QMS工作台
portable:
  artifactName: YunyiQMS-Portable-${version}.${ext}
