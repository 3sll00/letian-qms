# 集成同步是真实长任务（ERP 清点 / MES 批量拉取），默认 10s 读超时必然误报；
# 加长到 120s（仍受 max-time 全局约束）
[[operations]]
include-operation-id = "triggerIntegrationSync"
request-timeout = 120
