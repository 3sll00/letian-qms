    PendingDefectItem:
      type: object
      required: [id, inspectionOrderId, orderNo, inspectionType, batchNo, materialCode, materialName, defectQty, totalQty, defectDescription, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
