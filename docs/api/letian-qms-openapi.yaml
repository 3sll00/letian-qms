openapi: 3.1.0
info:
  title: Letian QMS API Specification
  version: 2.15.0
  description: 乐天紧固件质量管理系统契约规范，完全对齐 21 项业务能力、DDD 四层架构与 PostgreSQL 14+ 数据实体。
servers:
  - url: /api/v1
    description: 默认 API 网关基础路径
# 全站默认要求 Bearer 鉴权：本 spec 登记的 29 条路径**全部**落在受保护作用域内
# （根 /health 探针与开发态 /auth/** 均不登记在册，故无需逐路径声明 security: []）。
security:
  - bearerAuth: []

paths:
  /dashboard/overview:
    get:
      summary: 获取质量总览看板核心数据（卡片统计、ECharts环形图、趋势折线图与不良排行）
      operationId: getDashboardOverview
      responses:
        '200':
          description: 看板汇总数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardOverviewResponse'
        '401':
          $ref: '#/components/responses/ProblemDetails401'

  /release-gates/{batchNo}:
    get:
      summary: 成品检强制关卡放行状态纯读校验（MES过站前调用，纯读幂等无副作用）
      operationId: checkReleaseGate
      parameters:
        - name: batchNo
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: 批次已完成成品检且合格，允许放行过站
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseGateSuccessResponse'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '409':
          description: 强制关卡阻断，禁止放行
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ReleaseGateBlockedResponse'

  /plans/match:
    get:
      summary: 质检方案自动匹配（按物料编码 + 检验类型两级匹配已启用方案，返回待检指标清单）
      description: >-
        两级兜底匹配：第一级物料专属方案（material_code = materialCode），
        第二级存货分类通用方案（material_code = '' 且 category_code = 该物料所属分类）。
        两级共同要求 inspection_stage = inspectionType、version_status = 'ACTIVE'
        且版本生效周期覆盖当天；多命中取最新创建的一行。
        PBAC 方案域口径（docs/42 §3）：方案对象无供应商属性，本接口只判物料分类 + 物料编码，
        供应商维度不参与判定；物料维度越权返回 403 pbac-permission-denied。
        口径唯一真相见 docs/17-检验录入界面说明与质检方案匹配口径.md §7.3。
      operationId: matchInspectionPlan
      parameters:
        - name: materialCode
          in: query
          required: true
          description: 物料编码（精确匹配）
          schema:
            type: string
            minLength: 1
        - name: inspectionType
          in: query
          required: true
          schema:
            type: string
            enum: [IQC, IPQC_CT, IPQC_RL, IPQC_FN, OQC_SF, OQC_SH, OQC_HEAT, OQC_BLACK, OQC_ZINC, OQC_NICKEL, OQC_PHOSPH, OQC_DACRO, OQC_MACH]
      responses:
        '200':
          description: 命中已启用 (ACTIVE) 方案版本，返回版本行 UUID、命中来源与待检指标清单
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchedInspectionPlan'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '404':
          description: 两级匹配均未找到该物料 + 检验类型下的已启用质检方案（inspection-plan-not-found）

  /plans:
    get:
      summary: 获取质检方案列表（一行 = 一个 plan_code 聚合，按最新版本更新时间倒序）
      description: >-
        质检方案设计页台账的唯一数据来源（字段口径见 docs/20-质检方案设计页数据字段与接口打通设计.md）。
        materialName / categoryName / categoryId / createdByName 为读时 JOIN 派生字段（方案表不落冗余快照列：
        物料改名应即时反映），status 为方案级派生状态；前端不得再自行映射主数据名称或推导状态。
        total 为去重后的方案编码命中总数（不是版本行数），items 与兼容别名 list 指向同一份当页数据。
      operationId: listInspectionPlans
      parameters:
        - name: inspectionType
          in: query
          description: 契约检验类型枚举（13 值，含委外七分类），精确匹配 inspection_stage
          schema:
            type: string
            enum: [IQC, IPQC_CT, IPQC_RL, IPQC_FN, OQC_SF, OQC_SH, OQC_HEAT, OQC_BLACK, OQC_ZINC, OQC_NICKEL, OQC_PHOSPH, OQC_DACRO, OQC_MACH]
        - name: materialCode
          in: query
          description: 专属物料编码，模糊匹配
          schema:
            type: string
        - name: categoryCode
          in: query
          description: 存货分类编码；命中方案自身 category_code，或经主数据 materials 反查的物料所属分类（两者取 OR）
          schema:
            type: string
        - name: keyword
          in: query
          description: 方案编码 / 方案名称模糊匹配
          schema:
            type: string
        - name: isActive
          in: query
          description: true 时只返回存在 ACTIVE 版本的方案
          schema:
            type: boolean
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: 质检方案分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInspectionPlans'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
    post:
      summary: 新建质检方案（含首个草稿版本）
      description: >-
        契约正文 versions[0] 即首个草稿版本，一律以 DRAFT 落库（待质量主管审批后启用）；
        categoryCode 缺省时回落到绑定物料的真实存货分类。
        planCode 可省略：留空（不传该字段）由服务端按 QP-{YYYYMMDD}-{NNN} 取号；显式传入按原值使用，传空串会被 400 拒绝。
      operationId: createInspectionPlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInspectionPlanRequest'
      responses:
        '201':
          description: 创建成功，返回含首个草稿版本的方案
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InspectionPlan'
          links:
            planByVersionId:
              operationId: getInspectionPlan
              parameters:
                id: '$response.body#/versions/0/id'
            upgradeVersion:
              operationId: upgradePlanVersion
              parameters:
                versionId: '$response.body#/versions/0/id'
            toggleVersionStatus:
              operationId: togglePlanVersionStatus
              parameters:
                versionId: '$response.body#/versions/0/id'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '409':
          $ref: '#/components/responses/ProblemDetails409'
        '415':
          $ref: '#/components/responses/ProblemDetails415'

  /plans/stats:
    get:
      summary: 质检方案 KPI 聚合（方案总数 / 已启用 / 待审批 / 覆盖产品数）
      description: >-
        质检方案设计页 4 张 KPI 卡的唯一数据来源：由服务端全量聚合，只施加 PBAC 物料权限过滤，
        不受列表筛选条件与分页影响；严禁用当页列表数据推算全局 KPI（方案数超过一页时数字必然失真）。
      operationId: getInspectionPlanStats
      responses:
        '200':
          description: KPI 聚合结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanStats'
        '401':
          $ref: '#/components/responses/ProblemDetails401'

  /plans/{id}:
    get:
      summary: 获取质检方案详情（按版本行 UUID 查询，自动聚合该 plan_code 的全部版本）
      operationId: getInspectionPlan
      parameters:
        - name: id
          in: path
          required: true
          description: 方案版本行 UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 方案详情（含全部版本与指标项）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InspectionPlan'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '404':
          description: 方案不存在（not-found）

  /plans/versions/{versionId}/status:
    post:
      summary: 方案版本启停（审批）—— 启用 / 停用指定版本行
      description: >-
        目标版本由 URL 的 versionId（版本行 UUID）唯一确定，服务端不做任何「按方案编码回退」，
        避免审批动作落到非预期版本上。状态机由 @letian/domain 的 InspectionPlan 保证：
        ACTIVATE 后该版本为 ACTIVE 且同方案其它 ACTIVE 版本自动转 INACTIVE（单激活态），
        已 ACTIVE 的版本重复启用幂等放行，指标项为空的版本拒绝启用（400）；
        DEACTIVATE 只接受当前为 ACTIVE 的版本，已 INACTIVE 的版本幂等放行。
        角色门禁：仅 QA_MANAGER / ADMIN / SYSTEM 可执行，其余 403 forbidden
        （按角色判定而非权限位 —— 登录签发的 JWT 只带 role、不带 permissions）。
        POST /api/v1/plans 一律落 DRAFT，而 GET /plans/match 只认 ACTIVE，
        本接口是草稿版本进入自动匹配的唯一入口。
        口径唯一真相见 docs/17-检验录入界面说明与质检方案匹配口径.md §7.5.6。
      operationId: togglePlanVersionStatus
      parameters:
        - name: versionId
          in: path
          required: true
          description: 目标方案版本行 UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TogglePlanVersionStatusRequest'
      responses:
        '200':
          description: 启停成功，返回该方案的最新读模型（含派生 status：全部版本停用后为 DISABLED）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InspectionPlan'
        '400':
          description: >-
            非契约 action（validation-failed）；
            或空指标项版本不可启用 / 非 ACTIVE 版本不可停用（plan-toggle-failed）
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '403':
          description: 角色不足（forbidden）：仅质量主管 / 系统管理员可启停方案版本
        '404':
          description: 目标版本行不存在（plan-not-found）
        '415':
          $ref: '#/components/responses/ProblemDetails415'

  /plans/versions/{versionId}/upgrade:
    post:
      summary: 方案版本升版 —— 以指定版本行为模板产出新的草稿版本
      description: >-
        模板版本行由 URL 的 versionId（版本行 UUID）唯一确定，服务端不做「按方案编码回退」。
        省略字段的派生口径：versionNo 省略则由服务端在现有最大版本号上自动升位
        （v2.4/v2.5 → v2.6，保留原前缀写法与段数，撞号继续递增），显式传入按原值使用，
        与 plan_code 的服务端取号（TBD-11）完全对称；items / samplingScheme / aqlLevel /
        strictness 省略则沿用模板版本行；effectiveStartDate / effectiveEndDate 不继承
        （省略即长期有效 —— 照抄旧周期会让新草稿「出生即过期」）。
        新版本一律落 DRAFT，既有版本行的状态与指标项原样不动（历史检验单的 plan_snapshot
        不会被追溯改写），仍需经 …/status 的 ACTIVATE 审批才参与自动匹配。
        同一方案已有 DRAFT 版本时拒绝（400，保证连点不会造出多份待审批版本）。
        门禁：只做 PBAC 物料权限校验，不做角色门禁 —— 升版只产草稿、不改变生效状态，
        与「新建方案」POST /plans 同级；改变生效状态的 …/status 才需质量主管。
        口径唯一真相见 docs/17-检验录入界面说明与质检方案匹配口径.md §7.5.8。
      operationId: upgradePlanVersion
      parameters:
        - name: versionId
          in: path
          required: true
          description: 模板版本行 UUID（省略的指标项与抽样参数一律取自该版本行）
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpgradePlanVersionRequest'
      responses:
        '201':
          description: 升版成功，返回该方案的最新读模型（versions 中含新建的 DRAFT 版本）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InspectionPlan'
        '400':
          description: >-
            空版本号 / 空指标项被契约拒绝（validation-failed）；
            或该方案已有草稿版本（PLAN_DRAFT_ALREADY_EXISTS）、模板版本行不属于该方案
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '404':
          description: 目标版本行不存在（plan-not-found）
        '415':
          $ref: '#/components/responses/ProblemDetails415'

  /inspections:
    get:
      summary: 获取检验单列表（支持多维度组合筛选与 PBAC 行级数据隔离）
      operationId: listInspectionOrders
      parameters:
        - name: type
          in: query
          description: 前端台账页签分组（IQC / IPQC / FQC / OQC），与 `inspectionType` / `inspectionTypes` 互斥使用；实现侧接受任意字符串
          schema:
            type: string
        - name: inspectionType
          in: query
          description: 契约检验类型枚举（13 值，含委外七分类）单值精确匹配
          schema:
            type: string
            enum: [IQC, IPQC_CT, IPQC_RL, IPQC_FN, OQC_SF, OQC_SH, OQC_HEAT, OQC_BLACK, OQC_ZINC, OQC_NICKEL, OQC_PHOSPH, OQC_DACRO, OQC_MACH]
        - name: inspectionTypes
          in: query
          description: 检验类型多选，逗号分隔契约枚举值；逐项按 InspectionType 校验，非法值返回 400
          schema:
            type: string
            pattern: '^(\s*,)*\s*((IQC|IPQC_CT|IPQC_RL|IPQC_FN|OQC_SF|OQC_SH|OQC_HEAT|OQC_BLACK|OQC_ZINC|OQC_NICKEL|OQC_PHOSPH|OQC_DACRO|OQC_MACH)(\s*,\s*(IQC|IPQC_CT|IPQC_RL|IPQC_FN|OQC_SF|OQC_SH|OQC_HEAT|OQC_BLACK|OQC_ZINC|OQC_NICKEL|OQC_PHOSPH|OQC_DACRO|OQC_MACH)?)*)?(\s*,)*\s*$'
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, INSPECTING, DRAFT, PASSED, FAILED, IN_MRB_REVIEW, RE_INSPECTING, COMPLETED]
        - name: statuses
          in: query
          description: 状态多选，逗号分隔（如 `PENDING,INSPECTING`）；与 `status` 互斥，优先 `statuses`；逐项按 InspectionStatus 校验，非法值返回 400
          schema:
            type: string
            pattern: '^(\s*,)*\s*((PENDING|INSPECTING|DRAFT|PASSED|FAILED|IN_MRB_REVIEW|RE_INSPECTING|COMPLETED)(\s*,\s*(PENDING|INSPECTING|DRAFT|PASSED|FAILED|IN_MRB_REVIEW|RE_INSPECTING|COMPLETED)?)*)?(\s*,)*\s*$'
        - name: inspectionState
          in: query
          description: >-
            台账「检验状态」派生口径筛选（待检验/检验中/已合格/不合格）。
            由后端按 status + judgment 统一翻译：PENDING=status IN (PENDING,DRAFT)；
            INSPECTING=status IN (INSPECTING,RE_INSPECTING)；
            PASSED=status IN (COMPLETED,PASSED) AND judgment IS DISTINCT FROM 'FAILED'；
            FAILED=status IN (FAILED,IN_MRB_REVIEW) OR (status IN (COMPLETED,PASSED) AND judgment='FAILED')。
          schema:
            type: string
            enum: [PENDING, INSPECTING, PASSED, FAILED]
        - name: batchNo
          in: query
          schema:
            type: string
        - name: inboundNo
          in: query
          description: 入库单号模糊匹配（来料检验台账「入库单号」列；006 字段扩展，物理列 `inbound_no`，迁移 021 起取代 `receipt_no`）
          schema:
            type: string
        - name: materialCode
          in: query
          schema:
            type: string
        - name: supplierCode
          in: query
          schema:
            type: string
        - name: supplierCodes
          in: query
          description: 供应商多选，逗号分隔供应商编码；非法值返回 400
          schema:
            type: string
        - name: inspectors
          in: query
          description: 检验人多选，逗号分隔员工 UUID；逐项按 UUID 校验，非法值返回 400
          schema:
            type: string
            pattern: '^(\s*,)*\s*([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}(\s*,\s*([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})?)*)?(\s*,)*\s*$'
        - name: furnaceHeatNo
          in: query
          description: 炉批号模糊匹配（出货检验台账「炉批号」筛选框，docs/47 §4.2⑤）
          schema:
            type: string
        - name: dateFrom
          in: query
          description: 检验日期范围下界 YYYY-MM-DD（按 createdAt 过滤，含当日）；非日期格式返回 400
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          description: 检验日期范围上界 YYYY-MM-DD（含当日）；非日期格式返回 400
          schema:
            type: string
            format: date
        - name: keyword
          in: query
          description: 跨字段模糊检索（批次号 / 物料 / 检验单号 / 出库单号 / 客户订单号 / 客户）
          schema:
            type: string
        - name: salesOrderNo
          in: query
          description: 销售出库单号模糊匹配（出货检验 OQC 台账，008 字段扩展）
          schema:
            type: string
        - name: customerName
          in: query
          description: 客户名称模糊匹配（出货检验 OQC 台账，008 字段扩展）
          schema:
            type: string
        - name: salesOrderPoNo
          in: query
          description: 客户采购订单号模糊匹配（出货检验 OQC 台账，008 字段扩展）
          schema:
            type: string
        - name: dispatchDate
          in: query
          description: 出库日期精确匹配 YYYY-MM-DD（出货检验 OQC 台账，008 字段扩展）
          schema:
            type: string
        - name: erpStatus
          in: query
          description: ERP 出库单审核状态精确匹配：待审核 / 已审核 / 已拦截（008 字段扩展）
          schema:
            type: string
        - name: docKeyword
          in: query
          description: 单号模糊匹配，同时命中 `order_no` 与 `inbound_no`（来料检验台账「检验单号 / 入库单号」检索口径）
          schema:
            type: string
        - name: materialKeyword
          in: query
          description: 物料模糊匹配，同时命中 `material_code` 与 `material_name`
          schema:
            type: string
        - name: orderNo
          in: query
          description: >-
            检验单号模糊匹配，只命中 `order_no`（过程检验台账「检验工单」筛选口径）。
            与 `docKeyword`（`order_no` OR `inbound_no`，来料检验台账）刻意区分：
            过程检验无入库单概念，故不复用含 `inbound_no` 分支的联合检索。
            口径见 docs/28-过程检验台账工单号双筛选项数据字段与接口打通设计.md §2.1。
          schema:
            type: string
        - name: workOrderNo
          in: query
          description: >-
            MES 生产工单号模糊匹配（过程检验台账「生产工单」筛选口径）。
            与台账「MES生产工单」列显示口径一致：`work_order_no` 为空时以 `batch_no` 兜底匹配，
            避免「列上显示批次号、输入该值却查不到」。见 docs/28 §2.3。
          schema:
            type: string
        - name: outsourceNo
          in: query
          description: 委外加工单号模糊匹配（009 委外检验扩展）
          schema:
            type: string
        - name: processType
          in: query
          description: 加工类型精确匹配（009 委外检验扩展，如 镀锌 / 热处理）
          schema:
            type: string
        - name: partner
          in: query
          description: 往来单位模糊匹配：同时命中加工商 / 供应商名称与编码（009 委外检验扩展）
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: 检验单分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInspectionOrders'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
    post:
      summary: 创建或录入检验单（绑定并深拷贝当前激活的方案版本快照）
      operationId: createInspectionOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInspectionOrderRequest'
      responses:
        '201':
          description: 创建成功，已固化方案快照与明细指标行
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InspectionOrder'
          links:
            inspectionById:
              operationId: getInspectionOrder
              parameters:
                id: '$response.body#/id'
            updateHeader:
              operationId: updateInspectionHeader
              parameters:
                id: '$response.body#/id'
            submitMeasurements:
              operationId: submitMeasurements
              parameters:
                id: '$response.body#/id'
            approveOrder:
              operationId: approveInspectionOrder
              parameters:
                id: '$response.body#/id'
            finalizeStatus:
              operationId: finalizeInspectionStatus
              parameters:
                id: '$response.body#/id'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '404':
          description: 显式指定的 planVersionId 不存在（禁止静默降级，见 docs/17 §7）
        '409':
          $ref: '#/components/responses/ProblemDetails409'
        '415':
          $ref: '#/components/responses/ProblemDetails415'
        '422':
          description: >-
            传递门禁阻断（TRANSFER_BLOCKED）：上游权威检验单未终判合格 / MRB 未结案 / 链路已终止，
            未附特批豁免凭据 `transferOverride`。`details.transferDecision` 为完整判定结果，
            `details.blockedBy` 为现场精简三元组（docs/48 §4.6）。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /inspections/heat-batch-trace:
    get:
      summary: 炉批号溯源联动查询（出货检验录入页：按炉批号带出委外热处理 / 来料检验实测值）
      description: |
        三级链路**逐级回退且级别之间不合并**：L1 委外热处理（`OQC_HEAT`）→ L2 来料检验（`IQC`）→ L3 空态
        （`sourceType = NONE`，HTTP 200、不带任何值、不报错）。同级多命中取「**最近一次终判**」的一张；
        **未终判或判不合格的源单不参与带出**。
        炉批号的大小写 / 前后空格 / 全角空格 / 连字符 / 下划线差异一律**归一后**匹配
        （归一列 `furnace_heat_batch_no_norm`，迁移 034），`heatBatchNo` 回显**原值**。
        带出范围按 `metricCategory` 白名单（化学成分 / 力学性能 / 硬度 / 抗拉强度），且只带**源单里有实测值**的项；
        映射按 `itemCode` 精确匹配优先、`name` 归一包含兜底，匹配不到的目标指标行保持空值（不猜、不填 0）。
        `matchScope = GLOBAL` = 跨物料命中，界面据此提示「跨物料命中，请确认炉次归属」（口径见 docs/47）。
        同炉批号存在「不合格 / MRB 评审未结案 / 未终判」记录时，响应附 `upstreamWarning`（TBD-01）：
        **只提示、不带值、不阻断** —— 带出链路照常（有合格源单时）或在空态下只给提示，
        文案由服务端单点组装（含命中单号与处置指引），界面不二次拼文案。
      operationId: getFurnaceHeatTrace
      parameters:
        - name: heatBatchNo
          in: query
          required: true
          description: 炉批号（归一后匹配）
          schema:
            type: string
            minLength: 1
        - name: materialCode
          in: query
          description: 物料编码（选填；参与物料维度匹配，缺省按全局命中并回 `GLOBAL`）
          schema:
            type: string
        - name: excludeOrderId
          in: query
          description: >-
            正在编辑的本单 id（选填）：从「上游异常提示」（TBD-01）候选里**排除自己**。
            本单自身通常处于「检验中」，不排除会被判成「上游尚未终判」而给出假提示，
            让「上游两处均无」的炉号凭空冒出提示条（违背 R3 静默空态）。录入页必须带上本参数。
          schema:
            type: string
      responses:
        '200':
          description: 溯源联动结果（`sourceType = NONE` 表示两处均无记录，属正常空态）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FurnaceHeatTraceResponse'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '401':
          $ref: '#/components/responses/ProblemDetails401'

  /inspections/transfer-permits:
    post:
      summary: 传递许可批量预览（建单前预览 / 台账徽标 / 看板 / MES 关卡共用，纯读无副作用）
      description: |
        「合格后传递」的**读侧唯一入口**（docs/48 §4.5）：返回每项「现在能不能传递」+ 理由码 + 权威上游单。
        判定与建单门禁 `POST /inspections` 的 422 拒绝**同一份实现**（领域纯函数 `canTransferToNextStage`），
        因此不存在「预览说能、建单被拒」的第二套口径；本接口**不写审计、不写 Outbox、不加排他锁**。
        `allowed=true` 且 `code=UPSTREAM_MISSING` 是「放行但上游环节缺失」的显式标记（TBD-01），
        界面必须显示缺失徽标，不得当作"一切正常"。整批共用一个事务（一页 100 行 ≠ 100 个事务）。
      operationId: previewTransferPermits
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [inspectionType, batchNo]
                    properties:
                      inspectionType:
                        type: string
                        enum: [IQC, IPQC_CT, IPQC_RL, IPQC_FN, OQC_SF, OQC_SH, OQC_HEAT, OQC_BLACK, OQC_ZINC, OQC_NICKEL, OQC_PHOSPH, OQC_DACRO, OQC_MACH]
                        description: 本单环节（下游）
                      batchNo:
                        type: string
                        minLength: 1
                      materialCode:
                        type: string
                        minLength: 1
                      furnaceHeatNo:
                        type: string
                        description: 炉批号（同炉批号锚点 A2）
                      workOrderNo:
                        type: string
                        description: MES 生产工单号（同工单锚点 A3）
                      orderNo:
                        type: string
                        description: 调用方持有的单号（仅回显，便于前端对号入座）
      responses:
        '200':
          description: |
            每项返回 `decision`（完整 TransferDecision：`allowed` / `code` / `chainKey` / `chainKeyKind` /
            `precedentStage` / `predecessorOrderNo` / `predecessorStatus` / `mrbNo` / `mrbDisposition` /
            `permitEvidence` / `terminateChain` / `reason`）。形状真相见 `packages/contracts/src/schemas/transfer.ts`。
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '415':
          $ref: '#/components/responses/ProblemDetails415'

  /inspections/transfer-overrides/tickets:
    post:
      summary: 提报传递门禁特批豁免申请单（docs/48 §7 TBD-09，P2）
      description: |
        一线检验员在下游被门禁阻断后提报豁免申请；审批通过后由建单接口核销（**一单一核销**，核销后不可复用）。
        工单与目标「批次号 + 物料编码 + 检验类型」三元组绑定，核销时逐一比对，不匹配即 422。
        申请人身份由服务端按登录态写入（`applicantId` / `applicantName` 以 JWT 为准，请求体同名字段不生效）。
      operationId: createTransferOverrideTicket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [batchNo, materialCode, inspectionType, reason, applicantId]
              properties:
                batchNo: { type: string, minLength: 1 }
                materialCode: { type: string, minLength: 1 }
                inspectionType:
                  type: string
                  enum: [IQC, IPQC_CT, IPQC_RL, IPQC_FN, OQC_SF, OQC_SH, OQC_HEAT, OQC_BLACK, OQC_ZINC, OQC_NICKEL, OQC_PHOSPH, OQC_DACRO, OQC_MACH]
                  description: 目标下游环节（建单检验类型）
                workOrderNo: { type: string }
                furnaceHeatNo: { type: string }
                upstreamOrderNo:
                  type: string
                  description: 阻断该单的上游检验单号（便于审批人核对）
                reason:
                  type: string
                  minLength: 5
                  description: 豁免原因（至少 5 字，记入审计）
                applicantId:
                  type: string
                  format: uuid
                applicantName: { type: string }
      responses:
        '201':
          description: 豁免申请单（status=PENDING）。形状见 `TransferOverrideTicketSchema`。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
          links:
            reviewTicket:
              operationId: reviewTransferOverrideTicket
              parameters:
                ticketNo: '$response.body#/ticketNo'
        '400':
          description: 豁免原因不足 5 字等校验失败
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '415':
          $ref: '#/components/responses/ProblemDetails415'
    get:
      summary: 豁免申请单列表（可按批次 / 状态收窄）
      operationId: listTransferOverrideTickets
      parameters:
        - name: batchNo
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, APPROVED, REJECTED, CONSUMED]
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: 分页豁免申请单（items / total / page / pageSize）
          content:
            application/json:
              schema:
                type: object
                required: [items, total, page, pageSize]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  total: { type: integer }
                  page: { type: integer }
                  pageSize: { type: integer }
        '401':
          $ref: '#/components/responses/ProblemDetails401'

  /inspections/transfer-overrides/tickets/{ticketNo}/review:
    post:
      summary: 豁免申请单审批（APPROVE / REJECT；仅质量主管 QA_MANAGER / ADMIN / SYSTEM）
      description: |
        审批人身份由服务端按登录态写入并做角色门禁（`assertQualityApprover`），
        非质量主管一律 403；仅 `PENDING` 单可审批，重复审批 422。
      operationId: reviewTransferOverrideTicket
      parameters:
        - name: ticketNo
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, reviewerId]
              properties:
                action:
                  type: string
                  enum: [APPROVE, REJECT]
                reviewerId:
                  type: string
                  format: uuid
                reviewerName: { type: string }
                reviewNotes: { type: string }
                approvalDocNo:
                  type: string
                  description: 书面特批单据编号
      responses:
        '200':
          description: 审批后的申请单（APPROVED / REJECTED）
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '403':
          description: 非质量主管角色
        '404':
          description: 申请单不存在
        '415':
          $ref: '#/components/responses/ProblemDetails415'
        '422':
          description: 申请单非 PENDING（重复审批）

  /inspections/batch-freeze-terminated-chains:
    post:
      summary: 链路终止的下游在途单据安全冻结批处理（docs/48 §4.8 / TBD-06，P2）
      description: |
        扫描全部（或指定批次）`RETURN_TO_VENDOR` / `SCRAP` 的 MRB 评审单，对该批次下仍处于
        `PENDING` / `INSPECTING` / `DRAFT` 的检验单**追加冻结备注 + 审计 STATUS_CHANGE(frozen:true)**；
        **不改 `inspection_orders.status` 枚举**，单据仍可打开录入（录入硬阻断待客户口径确认）。
        `dryRun=true` 只预演不写库。别名 `/inspections/batch-freeze-terminated` 同义。
      operationId: batchFreezeTerminatedChains
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                dryRun:
                  type: boolean
                  default: false
                batchNo:
                  type: string
                  description: 限定批次号（可选；缺省全库扫描）
      responses:
        '200':
          description: |
            `scannedMrbCount` / `terminatedChainsCount` / `frozenOrdersCount` / `frozenOrders[]`（明细含
            orderNo / batchNo / inspectionType / sourceMrbNo / disposition / status）/ `dryRun` / `executedAt`。
            形状唯一真相：`BatchFreezeTerminatedChainsResponseSchema`（服务端响应过 `parse`）。
          content:
            application/json:
              schema:
                type: object
                required: [dryRun, scannedMrbCount, terminatedChainsCount, frozenOrdersCount, frozenOrders, executedAt]
                properties:
                  dryRun: { type: boolean }
                  scannedMrbCount: { type: integer }
                  terminatedChainsCount: { type: integer }
                  frozenOrdersCount: { type: integer }
                  frozenOrders:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  executedAt: { type: string }
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '415':
          $ref: '#/components/responses/ProblemDetails415'

  /inspections/{id}:
    get:
      summary: 获取检验单详情（含快照元数据、公差基准与明细指标实测）
      description: |
        检验录入页「只读回看」的唯一数据来源（口径：docs/17-检验录入界面说明与质检方案匹配口径.md §7.3 / §7.8）。
        返回体自带本单 `planSnapshot`（方案编码 / 版本 / 指标基准）与 `items`（实测值 + 单项判定 result + 免检标记），
        因此回看历史工单无需再按物料调 `GET /plans/match` 取"当前生效方案"，方案后续改版也不改写本单历史结论。
        注意：`items[].result` 是建单当时固化的落库判定，前端回看必须直接展示该值，不得按当前标准重算。
      operationId: getInspectionOrder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 检验单详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InspectionOrder'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '404':
          $ref: '#/components/responses/ProblemDetails404'

  /inspections/{id}/submit-measurements:
    post:
      summary: 录入检验指标实测值、检验备注并自动公差判定（支持保存草稿与正式提交）
      description: |
        可录入状态由聚合根守门：仅 `INSPECTING` / `DRAFT` 可写；未开检的两类单据（`PENDING` 新建单、
        `RE_INSPECTING` MRB 返工回边后的复检轮次单）由用例层按状态机边隐式开检为 `INSPECTING` 后再落数，
        终态（`PASSED` / `FAILED` / `IN_MRB_REVIEW` / `COMPLETED`）仍返回 400 `ORDER_NOT_EDITABLE`
        （见 docs/17 §7.9）。
        正式提交（`isDraft: false`）且公差判定为不合格时，追加口径与终判一致：**同一事务**内把该单 upsert 进
        不合格待审核池并**自动创建 MRB 评审单**（`PENDING_REVIEW`、按来源类型自动绑定评审流程），台账条目转
        `INITIATED` 并回填 `mrb_review_id`，检验单转 `IN_MRB_REVIEW`（见 docs/43-不合格判定自动发起MRB评审设计.md）。
        草稿保存（`isDraft: true`）不触发任何入池 / 建单动作。
        数量口径（docs/21 §14）：`passQty` / `failQty` 是检验员在录入弹窗里填写的合格 / 不合格数量，随判定
        **同事务**落 `inspection_orders.pass_qty / fail_qty`；不下发时服务端按抽样数派生兜底（首次判定时该值
        恒等于整批抽样数，即页面上的「检测数」）。自动创建的 MRB 单「不合格数量」恒取源单 `fail_qty`。
      operationId: submitMeasurements
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitMeasurementsRequest'
      responses:
        '200':
          description: 判定完成并更新单据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InspectionOrder'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '404':
          $ref: '#/components/responses/ProblemDetails404'
        '415':
          $ref: '#/components/responses/ProblemDetails415'

  /inspections/{id}/approve:
    post:
      summary: 质量负责人签核（写入 approver_id / approver_name / approved_at，并留一条 QUALITY_APPROVAL 审计留痕）
      description: 签核人取当前登录用户，请求体不接受自称的签核人；角色门禁 QA_MANAGER / ADMIN / SYSTEM，其余角色 403。口径见 docs/35 §5。
      operationId: approveInspectionOrder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveInspectionOrderRequest'
      responses:
        '200':
          description: 签核完成，返回更新后的检验单
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InspectionOrder'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '403':
          description: 当前角色无签核权限（不是 QA_MANAGER / ADMIN / SYSTEM）
        '404':
          description: 检验单不存在
        '415':
          $ref: '#/components/responses/ProblemDetails415'

  /inspections/{id}/status:
    post:
      summary: 检验单终判（状态 / 数量 / 综合结论），判定不合格时同一事务内自动汇入不合格待审核池并自动发起 MRB 评审
      description: |
        终判的**唯一写入口**（口径见 docs/39-不合格判定自动入池与MRB页可见性打通设计.md §2 D1 / §4、
        docs/43-不合格判定自动发起MRB评审设计.md §1 / §2）。
        - `status` 必填并受 `InspectionStatusEnum` 约束，非法值 400（不再无校验直接落库）。
        - 「判为不合格」判定式：终判后 `status = FAILED` **或** `judgment = FAILED`。此时服务端在**同一事务**内把该单
          upsert 进不合格待审核池（`pending_mrb_items`，幂等键 `source_order_id`），并**立即自动创建 MRB 评审单**
          （`mrb_reviews`，状态 `PENDING_REVIEW`，按来源类型自动绑定评审流程），台账条目同步转 `INITIATED` 且回填
          `mrb_review_id`，检验单转 `IN_MRB_REVIEW` —— **无人工发起环节**（docs/43，客户确认口径）。重复终判幂等：
          仍只有 1 条台账条目 / 1 张 MRB 单。
        - `preliminaryDisposition` 可选，作为自动建单时「处置方式」列初值（缺省 `REWORK`）。
        - `RE_INSPECTING`（MRB 返工回边）与 `COMPLETED`（归档终态）**不触发入池**。
        - 每次终判写一条 `STATUS_CHANGE` 审计留痕，`diffPatch.pendingDefectCollected` 明示本次是否入池。
        - 审计 `diffPatch` 追加 `mrbAutoInitiated` / `mrbReviewNo` / `preliminaryDisposition`，让「判不合格却没进评审」一眼可判。
      operationId: finalizeInspectionStatus
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinalizeInspectionStatusRequest'
      responses:
        '200':
          description: 终判完成，返回更新后的检验单
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InspectionOrder'
        '400':
          description: 请求体校验失败（status / judgment 非法取值）
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '404':
          description: 检验单不存在
        '415':
          $ref: '#/components/responses/ProblemDetails415'

