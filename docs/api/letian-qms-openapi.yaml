          description: 命中来源：MATERIAL = 物料专属方案；MATERIAL_CATEGORY = 存货分类通用方案（兜底命中）
        planVersionId:
          type: string
          format: uuid
          description: 命中的方案版本行 UUID，建单时原样回传给 POST /inspections
        versionNo:
          type: string
        inspectionType:
          type: string
          enum: [IQC, IPQC_CT, IPQC_RL, IPQC_FN, OQC_SF, OQC_SH, OQC_HEAT, OQC_BLACK, OQC_ZINC, OQC_NICKEL, OQC_PHOSPH, OQC_DACRO, OQC_MACH]
        materialCode:
          type: string
        samplingScheme:
          type: string
        aqlLevel:
          type: string
        strictness:
          type: string
        items:
          type: array
          description: 待检指标清单（结构同质检方案版本的 items）
          items:
            type: object
        matchedAt:
          type: string
          format: date-time
    InspectionPlanItem:
      type: object
      required: [itemCode, name]
