        inspectionType:
          type: string
          description: 检验类型/环节（IQC / IPQC / FQC / OQC 及其细分）
        batchNo:
          type: string
        materialCode:
          type: string
        materialName:
          type: string
        supplierName:
          type: string
          description: 供应商名称（来料类不合格时有值）
        customerName:
          type: string
          description: 客户名称（出货/委外类不合格时有值）
        defectQty:
          type: integer
          description: 不良数量
        totalQty:
          type: integer
          description: 受检数量（不良率分母口径 = 检验单抽样数量，非报检总数）
        defectRate:
          type: number
          description: 不良率(%) = defectQty / totalQty × 100，服务端按库内 defect_rate 回吐（保留 4 位小数）
        defectDescription:
          type: string
          description: 不合格现象/超差实测描述
        defectItemCode:
          type: string
          description: 具体不合格的指标项编码
        status:
          type: string
          enum: [PENDING_INITIATE, INITIATED, DISMISSED]
        mrbId:
          type: string
          format: uuid
          description: 关联的 MRB 评审单 ID（发起后回填，status = INITIATED）
        inspectorId:
          type: string
          format: uuid
        inspectorName:
          type: string
        createdAt:
          type: string
          format: date-time
          description: 汇入待审核池时间

    InitiateReviewRequest:
      type: object
      required: [pendingDefectId]
      properties:
        pendingDefectId:
          type: string
          format: uuid
          description: 待审核池条目 UUID
        flowId:
          type: string
          format: uuid
          description: 选用的评审流程定义 ID；省略时由后端按不合格类型自动匹配已启用流程
        urgencyLevel:
          type: string
          enum: [NORMAL, URGENT, CRITICAL]
          default: NORMAL
        reviewNotes:
          type: string
          description: 发起说明 / 初步建议处置方向

    ReviewFlow:
      type: object
      required: [flowCode, flowName, applicableType, nodes]
      properties:
        id:
          type: string
          format: uuid
        flowCode:
          type: string
          example: FLOW-IQC-FAIL
        flowName:
          type: string
        description:
          type: string
          description: 流程说明；落 review_flows.description（迁移 019 新增），供「评审流程设置」页流程卡片与详情行展示
        applicableType:
          type: string
          enum: [INCOMING_FAIL, PROCESS_FAIL, SHIPMENT_FAIL, SUBCONTRACT_FAIL]
        version:
          type: string
          default: v1.0.0
        isActive:
          type: boolean
          default: true
        nodes:
          type: array
          items:
            type: object
            required: [nodeLevel, nodeName, roleCode]
            properties:
              nodeLevel:
                type: integer
                description: 审批层级序号；**唯一排序键**（等价于「评审流程设置」页的「顺序」列，不再有 nodeSeq）
              nodeName:
                type: string
              roleCode:
                type: string
                description: 审批责任角色编码
              roleName:
                type: string
                description: 授权签署角色显示名；未配置时读侧回退 roleCode
              isRequired:
                type: boolean
                default: true
                description: 是否必签；必签节点未签署不得推进到下一层级
              allowConcession:
                type: boolean
                default: false
                description: 是否具有让步接收（特采）裁决权；默认仅终审层级为 true
              requireCustomerSign:
                type: boolean
                default: false
                description: 是否强制要求客户/客户代表书面签核

    MRBRecord:
      type: object
      required: [id, mrbNo, sourceType, sourceOrderNo, batchNo, materialCode, materialName, defectDescription, defectQty, status, approvers, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        mrbNo:
          type: string
          example: MRB-20260706-001
        sourceType:
          type: string
          enum: [INCOMING_FAIL, PROCESS_FAIL, SHIPMENT_FAIL, SUBCONTRACT_FAIL]
          description: 不合格来源分类（驱动评审流程路由）
        sourceOrderNo:
          type: string
          description: 关联的原始检验单号
          example: IQC20260706-001
        pendingDefectId:
          type: string
          format: uuid
          description: 关联的不合格待审核池记录 UUID（由池抽屉发起时回填）
        reviewFlowId:
          type: string
          format: uuid
          description: 发起时选用的评审流程定义 ID（落 mrb_reviews.review_flow_id）
        urgencyLevel:
          type: string
          enum: [NORMAL, URGENT, CRITICAL]
          default: NORMAL
          description: 紧急程度（落 mrb_reviews.urgency_level，默认 NORMAL）
        reviewNotes:
          type: string
          description: 发起说明/建议处置方向（落 mrb_reviews.review_notes，与不合格描述分离）
        batchNo:
          type: string
        materialCode:
          type: string
        materialName:
          type: string
        defectDescription:
          type: string
        defectQty:
          type: integer
        inspectorName:
          type: string
          description: >-
            源检验单检验人姓名（读侧按 sourceOrderNo 关联 inspection_orders.inspector_name 派生，
            非 mrb_reviews 物理列；查不到对应检验单时不返回该字段）
          example: 张检验
        status:
          type: string
          enum: [PENDING_REVIEW, UNDER_REVIEW, DISPOSED, REJECTED]
        disposition:
          type: string
          enum: [RETURN_TO_VENDOR, REWORK, CONCESSION, SCRAP]
          description: 最终裁决处置方案
        dispositionNotes:
          type: string
          description: 处置执行方案说明
        approvers:
          type: array
          description: 多方联合会签历史与签名记录
          items:
            type: object
            required: [userId, userName, roleCode, action, comment, signedAt]
            properties:
              userId:
                type: string
                format: uuid
              userName:
                type: string
              roleCode:
                type: string
                description: 会签席位角色编码（QA_MGR / TECH_DIR / PROD_SUP / MGMT_DIR）
              action:
                type: string
                enum: [APPROVED, REJECTED]
              comment:
                type: string
              signatureUrl:
                type: string
              signedAt:
                type: string
                format: date-time
        concessionAttachmentUrl:
          type: string
          description: 让步接收（特采）必须上传的客户书面同意书附件路径
        disposedAt:
          type: string
          format: date-time
          description: 处置闭环时间（DISPOSED 时写入 mrb_reviews.disposed_at）
        disposedBy:
          type: string
          description: 最终裁决人姓名（落 mrb_reviews.disposed_by）
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DisposeMRBRequest:
      type: object
      required: [disposition]
      description: >-
        处置决议提交体：除 disposition 外，必须在 dispositionReason / dispositionNotes / reason
        中至少提供一项（服务端强校验，缺失返回 400）。
      properties:
        disposition:
          type: string
          enum: [RETURN_TO_VENDOR, REWORK, CONCESSION, SCRAP]
          description: 处置决策方式（兼容别名 RETURN = RETURN_TO_VENDOR）
        dispositionReason:
          type: string
          description: 处置决议理由与防范措施（页面字段名；与 reason / dispositionNotes 至少一项）
        reason:
          type: string
          description: dispositionReason 的兼容别名
        dispositionNotes:
          type: string
          description: dispositionReason 的兼容别名
        approvers:
          type: array
          description: 可选：本次共同签署人凭证；省略时沿用会签历史，最终裁决人记入 disposedBy
          items:
            type: object
            required: [userId, userName, roleCode, action, comment, signedAt]
            properties:
              userId:
                type: string
                format: uuid
              userName:
                type: string
              roleCode:
                type: string
                description: 会签席位角色编码（QA_MGR / TECH_DIR / PROD_SUP / MGMT_DIR）
              action:
                type: string
                enum: [APPROVED, REJECTED]
              comment:
                type: string
              signatureUrl:
                type: string
              signedAt:
                type: string
                format: date-time
        concessionAttachmentUrl:
          type: string
          description: 特采让步接收时强制上传的客户书面签署凭证地址

    DisposeMRBResponse:
      description: >-
        处置结论响应体：主体仍是**裸 MRBRecord**（与 docs/04 §3.5 口径一致，非 { mrbReview } 包装对象），
        仅在「返工（REWORK）」连带生成下一轮复检单时追加 reinspectionOrderId / reinspectionOrderNo。
        两个追加字段均可选，故既有按 MRBRecord 解析的调用方完全向后兼容。
      allOf:
        - $ref: '#/components/schemas/MRBRecord'
        - type: object
          properties:
            reinspectionOrderId:
              type: string
              format: uuid
              description: 本次返工处置在同一事务内生成的复检单主键（非 REWORK 处置不返回）
            reinspectionOrderNo:
              type: string
              description: >-
                复检单号，口径恒为 {来源检验单号}-R{轮次}（轮次 = 该批次既有检验单数 + 1）；
                由 decide-mrb-disposition 用例算出，此前在控制器出口被丢弃
              example: IQC20260706-001-R2

    TraceabilityGraphResponse:
      type: object
      required: [batchNo, hasCycle, nodes, edges, impact]
      properties:
        batchNo:
          type: string
          description: 查询目标根批次号
        hasCycle:
          type: boolean
          description: 整条全链路是否存在循环引用，由应用层安全闭合
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/TraceNode'
        edges:
          type: array
          items:
            type: object
            required: [sourceBatchNo, targetBatchNo, relationType, depth]
            properties:
              id:
                type: string
                format: uuid
              sourceBatchNo:
                type: string
              targetBatchNo:
                type: string
              relationType:
                type: string
                enum: [RAW_TO_PROCESS, PROCESS_TO_PROCESS, PROCESS_TO_OUTSOURCE, OUTSOURCE_TO_FINISH, FINISH_TO_SHIPMENT]
              depth:
                type: integer
              isCycle:
                type: boolean
              hasCycleWarning:
                type: boolean
        impact:
          $ref: '#/components/schemas/TraceImpactSummary'

    TraceNode:
      type: object
      required: [nodeId, batchNo, stageName, materialName, operatorName, timestamp, nodeStatus]
      properties:
        nodeId:
          type: string
        batchNo:
          type: string
          description: 生产或物料批次号（追溯主键）
        stageName:
          type: string
          description: 工序节点名称（如 原材料来料检、下料检验、滚丝检验、委外镀锌、成品检）
        materialName:
          type: string
        operatorName:
          type: string
        timestamp:
          type: string
        nodeStatus:
          type: string
          description: 节点状态（6 值）。CONCESSION 即特采/让步接收，必须能同时举证 MRB 单号与客户书面授权件，不得展示为已合格
          enum: [PASSED, FAILED, INSPECTING, PENDING, STORED, CONCESSION]
        orderNo:
          type: string
          description: 关联来源单据号（工单 / 采购单 / 委外单 / 销售出库单）
        supplierOrCustomer:
          type: string
        materialCode:
          type: string
          description: 物料编码；主数据未建档时缺省，界面显示 —
        furnaceHeatBatchNo:
          type: string
          description: 炉批号（钢材炉号 / 热处理炉批号）；无炉批概念时缺省
        inspectionOrderNo:
          type: string
          description: 本节点对应检验单号；该环节尚未建检验单时缺省
        mrbNo:
          type: string
          description: 特采节点的 MRB 评审单号
        concessionAttachmentUrl:
          type: string
          description: 特采节点的客户书面授权件地址；缺失即表示未取得客户授权

    TraceImpactSummary:
      type: object
      required: [downstreamBatchCount, upstreamBatchCount, downstreamOrderCount, downstreamPartyCount, downstreamOrderNos, downstreamParties]
      properties:
        downstreamBatchCount:
          type: integer
          minimum: 0
        upstreamBatchCount:
          type: integer
          minimum: 0
        downstreamOrderCount:
          type: integer
          minimum: 0
        downstreamPartyCount:
          type: integer
          minimum: 0
        downstreamOrderNos:
          type: array
          items:
            type: string
        downstreamParties:
          type: array
          items:
            type: string
          description: 下游单位。节点表只有单一 supplier_or_customer 列、不区分客户与供应商，故不称「客户数」

    TraceBatchSummary:
      type: object
      required: [batchNo, materialName, sources, relatedOrderNos]
      properties:
        batchNo:
          type: string
        furnaceHeatBatchNo:
          type: string
        materialCode:
          type: string
        materialName:
          type: string
        stageName:
          type: string
          description: 当前/最近工序环节名；仅有检验台账时缺省
        nodeStatus:
          type: string
          enum: [PASSED, FAILED, INSPECTING, PENDING, STORED, CONCESSION]
        timestamp:
          type: string
        inspectionOrderNo:
          type: string
        orderNo:
          type: string
        supplierOrCustomer:
          type: string
        sources:
          type: array
          items:
            type: string
            enum: [TRACE_NODE, INSPECTION_ORDER]
          description: 本行命中来源；只有 INSPECTION_ORDER 表示「仅检验台账、尚无血缘」
        relatedOrderNos:
          type: array
          items:
            type: string

    TraceBatchSearchResponse:
      type: object
      required: [total, page, pageSize, items]
      properties:
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        items:
          type: array
          items:
            $ref: '#/components/schemas/TraceBatchSummary'

    TraceOrderChainStage:
      type: object
      required: [seq, stageName, orderNo, orderType, batchNo, status]
      properties:
        seq:
          type: integer
          minimum: 1
          description: 工艺序位（按检验类型映射，非时间排序）
        stageName:
          type: string
        orderNo:
          type: string
        orderType:
          type: string
        batchNo:
          type: string
        sourceDocNo:
          type: string
        status:
          type: string
          enum: [PASSED, FAILED, INSPECTING, PENDING, STORED, CONCESSION]
        judgment:
          type: string
          enum: [PASSED, FAILED, CONCESSION]
        inspectorName:
          type: string
        occurredAt:
          type: string
        durationMinutes:
          type: integer
          minimum: 0
          description: 耗时分钟数；无终检时间时缺省，界面显示 —

    TraceOrderChainResponse:
      type: object
      required: [orderNo, matchedBy, batchNos, stages]
      properties:
        orderNo:
          type: string
        matchedBy:
          type: string
          enum: [SALES_ORDER_PO_NO, SALES_ORDER_NO, WORK_ORDER_NO, ORDER_NO]
        customerName:
          type: string
        erpStatus:
          type: string
        salesOrderNo:
          type: string
        salesOrderPoNo:
          type: string
        batchNos:
          type: array
          items:
            type: string
        materialCode:
          type: string
        materialName:
          type: string
        totalQty:
          type: number
        stages:
          type: array
          items:
            $ref: '#/components/schemas/TraceOrderChainStage'

    SyncRequest:
      type: object
      required: [target]
      properties:
        target:
          type: string
          enum:
            - ERP_SUPPLIERS
            - ERP_CUSTOMERS
            - ERP_INVENTORY
            - ERP_CATEGORIES
            - ERP_WAREHOUSES
            - ERP_WORKSHOPS
            - ERP_EMPLOYEES
            - MES_PRODUCTION_BATCHES

    SyncResponse:
      type: object
      required: [syncLogId, target, status, recordsCount, syncedAt]
      properties:
        syncLogId:
          type: string
          format: uuid
          description: 本次触发数据同步的任务/日志唯一ID
        target:
          type: string
        status:
          type: string
          enum: [SUCCESS, PARTIAL_FAIL, FAILED]
        recordsCount:
          type: integer
        syncedAt:
          type: string
          format: date-time

    PaginatedInspectionOrders:
      type: object
      required: [total, page, pageSize, list]
      properties:
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        list:
          type: array
          items:
            $ref: '#/components/schemas/InspectionOrder'

    PaginatedMRBRecords:
      type: object
      required: [total, pendingCount, underReviewCount, totalReviewedCount, disposedCount, monthlyReviewRate, items, page, pageSize]
      properties:
        total:
          type: integer
          description: 当前过滤条件下的总条数（PBAC 行级过滤后）
        pendingCount:
          type: integer
          description: 待评审数量
        underReviewCount:
          type: integer
          description: 评审中数量
        totalReviewedCount:
          type: integer
          description: 累计已评审数量
        disposedCount:
          type: integer
          description: 已处置完成数量
        monthlyReviewRate:
          type: number
          description: 本月评审完成率 (0~100 百分比)，口径 = 本月已处置 / 本月发起，本月无单据时为 0
        items:
          type: array
          description: MRB 评审单据明细列表（当页数据）
          items:
            $ref: '#/components/schemas/MRBRecord'
        page:
          type: integer
          description: 当前页码
        pageSize:
          type: integer
          description: 每页条数
        list:
          type: array
          description: 兼容别名，与 items 指向同一份当页数据
          items:
            $ref: '#/components/schemas/MRBRecord'

    AuditStatsResponse:
      type: object
      required: [totalLogs, successCount, failedCount, todayCount]
      properties:
        totalLogs:
          type: integer
        successCount:
          type: integer
        failedCount:
          type: integer
        todayCount:
          type: integer

    AuditLog:
      type: object
      required: [traceId, userId, userName, action, resourceType, resourceId, status]
      properties:
        id:
          type: string
          format: uuid
        traceId:
          type: string
        userId:
          type: string
          format: uuid
        userName:
          type: string
        action:
          type: string
          enum: [CREATE, UPDATE, STATUS_CHANGE, DISPOSE, GATE_BLOCKED, AUTH_FAILED, VALIDATION_REJECTED, SYNC_TRIGGER]
        resourceType:
          type: string
        resourceId:
          type: string
        status:
          type: string
          enum: [SUCCESS, REJECTED, FAILED]
        diffPatch:
          type: object
        createdAt:
          type: string
          format: date-time
