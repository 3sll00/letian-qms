  /traceability/chain-status:
    get:
      summary: 看板「传递链状态」—— 链路各环节排序 + 每环节的传递判定（合格后传递，docs/48 §4.6 P1）
      description: |
        一次返回该链路**各环节排序 + 每环节的传递判定**，供【质量追溯链路看板】顶栏与「传递闸门」可视化使用。
        三条口径（全部服务端定，前端不得二次推导；真相在 `packages/application/src/use-cases/traceability/chain-status.ts`）：
        ① 环节行**由检验单派生**（`inspection_orders`，按工艺序位升序），不看 `batch_trace_nodes`（后者终判才落节点）；
        ② 环节状态取该环节**权威单**的单张判定（复检轮次最高 → 最近一次终判，docs/48 §2.4）；
        ③ 闸门判定与建单门禁 / 台账徽标**同一份**（`canTransferToNextStage`），因此看板与现场看到的结论不可能不一致。
        `summary.state` 取最严重环节（`TERMINATED` > `BLOCKED` > `PENDING` > `RELEASED`）；整条链路零单据时为 `MISSING`。
        `summary.blockedBy` 取**该环节自身**的判定码（`stateCode`），与 `decision.code`（「本环节当初为什么能开始」）语义分离。
        **实时重算，不做缓存**；PBAC 未授权一律 403（详情视图，fail-closed）。
      operationId: getChainStatus
      parameters:
        - name: batchNo
          in: query
          required: true
          description: 批次号（链路入口 / 追溯主键）
          schema:
            type: string
            minLength: 1
        - name: materialCode
          in: query
          description: 物料编码（多物料混批时收窄到某一物料；省略则返回整批次全部物料）
          schema:
            type: string
            minLength: 1
        - name: furnaceHeatNo
          in: query
          description: 炉批号（同炉批号锚点 A2，供跨批次链路使用）
          schema:
            type: string
            minLength: 1
        - name: workOrderNo
          in: query
          description: MES 生产工单号（同工单锚点 A3）
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: |
            链路状态。`stages[]` 只列已建单环节，每项含 `stage` / `seq` / `state` / `stateCode` / `stateReason` /
            `orderNo` / `orderStatus` / `overallDecision` / `mrbNo` / `mrbDisposition` / `updatedAt` / `decision`（完整 TransferDecision）。
            形状唯一真相：`packages/contracts/src/schemas/transfer.ts` 的 `ChainStatusResponseSchema`（Zod；服务端响应过 `parse`）。
          content:
            application/json:
              schema:
                type: object
                required: [batchNo, anchor, stages, summary, generatedAt]
                properties:
                  batchNo:
                    type: string
                  materialCode:
                    type: string
                    description: 物料限定（调用方传入时回显）
                  anchor:
                    type: object
                    required: [kind, value]
                    properties:
                      kind:
                        type: string
                        enum: [BATCH, HEAT, WORK_ORDER]
                      value:
                        type: string
                  stages:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  summary:
                    type: object
                    required: [state, releasedCount, blockedCount, pendingCount, terminatedCount, terminated]
                    properties:
                      state:
                        type: string
                        enum: [RELEASED, BLOCKED, PENDING, MISSING, TERMINATED]
                      releasedCount:
                        type: integer
                      blockedCount:
                        type: integer
                      pendingCount:
                        type: integer
                      terminatedCount:
                        type: integer
                      terminated:
                        type: boolean
                      blockedStage:
                        type: string
                      blockedBy:
                        type: object
                        additionalProperties: true
                  generatedAt:
                    type: string
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '403':
          description: PBAC 未授权（链路视图是详情视图，fail-closed）

  /traceability/transfer-kpis:
    get:
      summary: 传递链 KPI 聚合（阻断率 / 特采率 / 豁免率 / 平均阻断时长，docs/48 §12.5 / docs/50，P2）
      description: |
        全库检验单按「建单传递留痕 `upstream_gate_code`」聚合：正常放行 / 上游缺失放行（TBD-01）/
        特采放行 / 返工放行 / 特批豁免 / 当前阻断 / 整链终止，附各环节分工序 Breakdown。
        `averageBlockDurationHours` 口径（docs/48 §12.5 已固化）：起点 = 该下游批次最早
        `GATE_BLOCKED` 审计日志，终点 = 该下游单成功创建（放行），含 MRB 评审等待；
        尚未放行的在途阻断**不计入分母**。**实时重算，不做缓存**。
      operationId: getTransferKpis
      responses:
        '200':
          description: 传递链 KPI（形状唯一真相：`TransferKpisSchema`）
          content:
            application/json:
              schema:
                type: object
                required:
                  - totalInspections
                  - passCount
                  - missingUpstreamCount
                  - concessionPassCount
                  - reworkPassCount
                  - overridePassCount
                  - blockedCount
                  - terminatedCount
                  - blockRate
                  - concessionRate
                  - overrideRate
                  - missingUpstreamRate
                  - averageBlockDurationHours
                  - stageBreakdown
                  - generatedAt
                properties:
                  totalInspections: { type: integer }
                  passCount: { type: integer }
                  missingUpstreamCount: { type: integer }
                  concessionPassCount: { type: integer }
                  reworkPassCount: { type: integer }
                  overridePassCount: { type: integer }
                  blockedCount: { type: integer }
                  terminatedCount: { type: integer }
                  blockRate: { type: number }
                  concessionRate: { type: number }
                  overrideRate: { type: number }
                  missingUpstreamRate: { type: number }
                  averageBlockDurationHours: { type: number }
                  stageBreakdown:
                    type: object
                    additionalProperties: true
                  generatedAt: { type: string }
        '401':
          $ref: '#/components/responses/ProblemDetails401'

  /traceability/orders/{orderNo}:
    get:
      summary: 本订单检验环节 —— 订单维度的检验台账视图（同一订单下各环节并列，不是血缘链路）
      operationId: getOrderTraceChain
      parameters:
        - name: orderNo
          in: path
          required: true
          schema:
            type: string
            minLength: 1
          description: 检验单号 / MES 工单号 / 销售出库单号 / 客户采购订单号
      responses:
        '200':
          description: 本订单检验环节。stages 按工艺序位升序；无终检时间时 durationMinutes 缺省（界面显示 —）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TraceOrderChainResponse'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '403':
          description: PBAC 未授权。订单维度是详情视图，fail-closed
        '404':
          description: 未找到该订单号对应的检验单（TRACE_ORDER_NOT_FOUND）

  /traceability/{batchNo}:
    get:
      summary: 根据批次号获取全链路端到端追溯图谱（基于 PostgreSQL 14+ 递归 CTE 生成的真实 DAG）
      operationId: getTraceabilityGraph
      parameters:
        - name: batchNo
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - name: direction
          in: query
          required: false
          schema:
            type: string
            enum: [FORWARD, BACKWARD, BOTH]
            default: BOTH
          description: 正向（沿生产流向追到出货）/ 反向（倒查上游炉批号与来料）/ 双向
        - name: maxDepth
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 5
      responses:
        '200':
          description: 批次溯源 DAG 图结构数据（节点、边、影响面统计与成环预警）。节点缺值一律缺省或 null，不得用空串占位
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TraceabilityGraphResponse'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '403':
          description: PBAC 命中物料行级权限拦截（fail-closed）；界面必须提示「权限拦截」而不是「无数据」
        '404':
          $ref: '#/components/responses/ProblemDetails404'

  /integration/sync:
    post:
      summary: ERP 主数据即时同步（管家婆 → 本地镜像；前端主数据页「一键同步」调用）
      description: >-
        直连管家婆 ERP（SQL Server）拉取存货 / 供应商 / 仓库等主数据并 upsert 到本地镜像表，
        成功失败都以 200 返回（失败信息在 `details.success=false` / `message`），
        实现见 `apps/api/src/controllers/integration.controller.ts` 的 `POST /sync`。
        **无请求体**：全量同步，不接筛选参数。
      operationId: syncErpMasterData
      responses:
        '200':
          description: 同步执行结果（details 内含各类档案同步条数；`details.success=false` 表示 ERP 连接失败）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErpSyncResponse'
        '401':
          $ref: '#/components/responses/ProblemDetails401'

  /integration/sync/trigger:
    post:
      summary: 触发同步流水任务（ERP 本地镜像清点 / MES 测试库生产质检实绩同步，写入 integration_sync_logs）
      description: >-
        `systemType=ERP` 时对本地 ERP 主数据镜像表做一次真实清点并把行数写入同步流水；
        `systemType=MES` 时直连 MES 测试库（mes_letian_test）同步车间生产与质检实绩。
        本环境没有可达的真实外部 MES/ERP 服务，不伪造远端拉取条数；接入真实外部系统后替换清点逻辑。
        实现见 `integration.controller.ts` 的 `POST /sync/trigger`。
      operationId: triggerIntegrationSync
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncRequest'
      responses:
        '200':
          description: 同步流水已登记（syncLogId 可回查 integration_sync_logs）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResponse'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '415':
          $ref: '#/components/responses/ProblemDetails415'

  /audit/stats:
    get:
      summary: 获取系统操作日志汇总统计卡片（总数、成功数、失败数、今日操作数）
      operationId: getAuditStats
      responses:
        '200':
          description: 操作审计统计数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditStatsResponse'
        '401':
          $ref: '#/components/responses/ProblemDetails401'

  /audit/logs:
    get:
      summary: 分页获取系统关键操作审计日志列表（防篡改流）
      operationId: getAuditLogs
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: action
          in: query
          description: 操作类型过滤（契约 AuditAction 枚举，非枚举值返回 400）
          schema:
            type: string
            enum: [CREATE, UPDATE, STATUS_CHANGE, DISPOSE, GATE_BLOCKED, AUTH_FAILED, VALIDATION_REJECTED, SYNC_TRIGGER]
        - name: status
          in: query
          schema:
            type: string
            enum: [SUCCESS, REJECTED, FAILED]
        - name: resourceType
          in: query
          description: 资源类型过滤（任意字符串）
          schema:
            type: string
        - name: resourceId
          in: query
          description: 资源 ID 过滤（任意字符串）
          schema:
            type: string
      responses:
        '200':
          description: 操作日志明细列表
          content:
            application/json:
              schema:
                type: object
                required: [items, total, page, pageSize]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLog'
                  total:
                    type: integer
                  page:
                    type: integer
                  pageSize:
                    type: integer
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '401':
          $ref: '#/components/responses/ProblemDetails401'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        开发态登录 `POST /auth/login` 签发的 JWT（HS256，jsonwebtoken，默认 1 天有效期）。
        受保护作用域内的**全部业务路由**（`/api/v1/**`）在 onRequest 阶段强制校验
        `Authorization: Bearer <token>`，缺失 / 格式非 Bearer / 校验失败或过期一律 401（RFC 7807）。
        免鉴权入口只有两处，且都不在本 spec 的路径清单内：根 `/health` 探针（不在 `/api/v1` 下）
        与开发态 `/auth/**`（生产环境该控制器整体不注册路由，改走企业 SSO / OAuth2 / LDAP）。
        口径见 `apps/api/src/app.ts` 第 5~6 步与 `apps/api/src/plugins/auth.ts`。
  responses:
    ProblemDetails400:
      description: >-
        请求校验失败（RFC 7807）：路径 / 查询 / 请求体未过 Zod 契约校验，
        或 PostgreSQL 拒绝的非法 JSONB 载荷（SQLSTATE 22P05 已映射为 400，见
        `apps/api/src/plugins/error-handler.ts`）。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ProblemDetails401:
      description: >-
        未提供认证凭据 / Bearer 格式非法 / JWT 校验失败或过期（RFC 7807）。
        全部受保护路由在 onRequest 阶段统一拦截，与业务无关。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ProblemDetails403:
      description: 角色或 PBAC 物料行级权限不足（RFC 7807，fail-closed）。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ProblemDetails404:
      description: 目标资源不存在（RFC 7807）：URL 指定的实体行未找到。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ProblemDetails409:
      description: >-
        资源状态 / 唯一性冲突（RFC 7807）：主键或唯一约束冲突（SQLSTATE 23505）、
        已发起过评审、成品检强制关卡拦截等。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ProblemDetails415:
      description: >-
        请求体 Content-Type 缺失或不受支持（RFC 7807）：带体写接口只收
        `application/json`，缺省 Content-Type 一律拒绝。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ProblemDetails422:
      description: >-
        业务门禁阻断（RFC 7807）：传递门禁判定不可放行（TRANSFER_BLOCKED），
        `details` 含完整 `transferDecision` 与 `blockedBy` 三元组（docs/48 §4.6）。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    ProblemDetails:
      type: object
      required: [type, title, status, detail, code]
      description: >-
        统一错误响应体（RFC 7807 `application/problem+json`）。由全局错误处理器
        `apps/api/src/plugins/error-handler.ts` 单点组装：业务错误（validation-failed /
        not-found / conflict / forbidden / gate-blocked 等）、Fastify 框架错误（415 等）
        与未预期 5xx 全部走这一形状，`code` 为机器可读错误码，`traceId` 与审计 / 日志同源。
      properties:
        type:
          type: string
          format: uri
          description: 错误类型 URI（https://letian-qms.com/errors/{code}）
        title:
          type: string
          description: 人类可读错误摘要
        status:
          type: integer
          description: HTTP 状态码（与响应行一致）
        detail:
          type: string
          description: 详细原因（含校验失败字段清单）
        instance:
          type: string
          description: 出错请求路径
        code:
          type: string
          description: 机器可读错误码（validation-failed / unauthorized / not-found / conflict / transfer-blocked 等）
        traceId:
          type: string
          description: 链路追踪 ID（req-*）
        invalidParams:
          type: array
          description: Zod 校验失败字段明细（仅 400 出现）
          items:
            type: object
            properties:
              name: { type: string }
              reason: { type: string }
        details:
          type: object
          description: 业务附加上下文（如门禁阻断的 transferDecision / blockedBy）
          additionalProperties: true
    FurnaceHeatTraceResponse:
      type: object
      required: [heatBatchNo, sourceType, matchScope, inheritedItems]
      properties:
        heatBatchNo:
          type: string
          description: 被查询的炉批号（回显原值，非归一值）
        sourceType:
          type: string
          enum: [OUTSOURCE_HEAT_TREATMENT, IQC_RAW_MATERIAL, NONE]
          description: 关联来源：委外热处理 / 来料检验 / 无记录
        matchScope:
          type: string
          enum: [MATERIAL, GLOBAL]
          description: 命中范围：MATERIAL = 同物料命中；GLOBAL = 跨物料命中（或未带物料编码）
        sourceOrderNo:
          type: string
          description: 来源检验单号（`NONE` 时缺省）
        sourceOrderId:
          type: string
          description: 来源检验单主键（`NONE` 时缺省）
        sourceMaterialCode:
          type: string
          description: 源单物料编码（跨物料命中时供界面确认归属）
        inspectedAt:
          type: string
          description: 源单检验日期 / 终判时间（优先业务检验日期）
        inheritedItems:
          type: array
          description: 带出项（白名单类别 + 源单有实测值；`NONE` 或无可带出项时为空数组）
          items:
            type: object
            required: [itemCode, name, metricCategory]
            properties:
              itemCode:
                type: string
              name:
                type: string
              metricCategory:
                type: string
                description: 源项类别（CHEMICAL_COMPOSITION / MECHANICAL_PERFORMANCE / HARDNESS / TENSILE_STRENGTH）
              measuredVal:
                type: number
              measuredText:
                type: string
              unit:
                type: string
        upstreamWarning:
          type: object
          required: [code, orderNos, message]
          description: >-
            上游异常提示（TBD-01）：同一炉批号存在「不合格 / MRB 评审未结案 / 未终判」记录时给出，
            只提示、不带值、不阻断（带出与阻断分离，跨环节阻断属 docs/48 职责）；无异常时**整个字段缺省**。
          properties:
            code:
              type: string
              enum: [UPSTREAM_FAILED, UPSTREAM_UNDER_MRB, UPSTREAM_INSPECTING]
              description: >-
                命中理由码，同类内只报优先级最高的一类：上游判不合格 / MRB 评审未结案 / 上游尚未终判
            orderNos:
              type: array
              description: 命中的单据号（升序，最多 10 条，超出截断）
              items:
                type: string
            message:
              type: string
              description: 中文可读提示（服务端单点组装，界面直接展示、不二次拼文案）

    UpdateInspectionHeaderRequest:
      type: object
      properties:
        furnaceHeatNo:
          type: string
          maxLength: 64
          description: 炉批号（Heat No）；落 inspection_orders.furnace_heat_batch_no，**空串表示清空**（同时把溯源留痕归零）
        materialGrade:
          type: string
          maxLength: 64
          description: 材质牌号（如 ML40Cr）
        techStandard:
          type: string
          maxLength: 128
          description: 执行产品技术标准（如 GB/T 3098.1-2010）
        inspectedDate:
          type: string
          maxLength: 32
          description: 检验日期 YYYY-MM-DD

    DashboardOverviewResponse:
      type: object
      required: [totalInspections, passRate, pendingCount, inspectingCount, failedCount, inMRBCount, stageDistribution, trendSeries, topDefects, recentActivities]
      properties:
        totalInspections:
          type: integer
        passRate:
          type: number
        pendingCount:
          type: integer
        inspectingCount:
          type: integer
        failedCount:
          type: integer
        inMRBCount:
          type: integer
        stageDistribution:
          type: object
          properties:
            iqcCount:
              type: integer
            ipqcCount:
              type: integer
            oqcCount:
              type: integer
        trendSeries:
          type: array
          description: 近 7 天趋势（工单创建日分组，按三检验环节分段计数）
          items:
            type: object
            required: [date, iqcCount, ipqcCount, oqcCount, passRate]
            properties:
              date:
                type: string
              iqcCount:
                type: integer
              ipqcCount:
                type: integer
              oqcCount:
                type: integer
              passRate:
                type: number
        topDefects:
          type: array
          description: 不良排行（按缺陷名称聚合）
          items:
            type: object
            required: [defectName, category, count]
            properties:
              defectName:
                type: string
              category:
                type: string
              count:
                type: integer
        recentActivities:
          type: array
          items:
            type: object
            required: [id, type, title, status, timestamp]
            properties:
              id:
                type: string
              type:
                type: string
              title:
                type: string
              status:
                type: string
              timestamp:
                type: string

    ReleaseGateSuccessResponse:
      type: object
      required: [batchNo, gateStatus, inspectionOrderId, verifiedAt]
      properties:
        batchNo:
          type: string
        gateStatus:
          type: string
          enum: [RELEASED]
        inspectionOrderId:
          type: string
          format: uuid
        verifiedAt:
          type: string
          format: date-time

    ReleaseGateBlockedResponse:
      description: >-
        强制关卡拦截（HTTP 409，`application/problem+json`）：在 ProblemDetails 之上
        附加批次 / 关卡 / 理由码 / 相关单据号，客户端按 `code` / `gateCode` 分支即可，
        不必解析 `title`（实现见 `release-gates.controller.ts`）。
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          required: [batchNo, requiredGate, gateCode, inspectionOrderNo, mrbNo, terminateChain]
          properties:
            batchNo:
              type: string
            requiredGate:
              type: string
              enum: [OQC]
            gateCode:
              type: string
              description: 传递判定理由码（TransferGateCode，如 UPSTREAM_FAILED / UPSTREAM_UNDER_MRB）
            inspectionOrderNo:
              type: [string, 'null']
              description: 相关检验单号（无关联单时为 null）
            mrbNo:
              type: [string, 'null']
              description: 相关 MRB 评审单号（无 MRB 时为 null）
            terminateChain:
              type: boolean
              description: 链路是否已终止（上游 RETURN_TO_VENDOR / SCRAP 终局）

    InspectionOrder:
      type: object
      required: [id, orderNo, inspectionType, status, materialCode, materialName, batchNo, planVersionId, sampleQty, createdAt, items]
      properties:
        id:
          type: string
          format: uuid
        orderNo:
          type: string
          description: >-
            检验单号，规则 {类型前缀}-{YYYYMMDD}-{4位流水号}；出货检验为 OQC-SH-YYYYMMDD-NNNN。
            创建时可省略，由服务端按该规则在事务内取号（同一前缀+同一日期内严格递增、并发不重号）
          example: OQC-SH-20260706-0001
        inspectionType:
          type: string
          enum: [IQC, IPQC_CT, IPQC_RL, IPQC_FN, OQC_SF, OQC_SH, OQC_HEAT, OQC_BLACK, OQC_ZINC, OQC_NICKEL, OQC_PHOSPH, OQC_DACRO, OQC_MACH]
        status:
          type: string
          enum: [PENDING, INSPECTING, DRAFT, PASSED, FAILED, IN_MRB_REVIEW, RE_INSPECTING, COMPLETED]
        overallDecision:
          type: string
          enum: [PASSED, FAILED, CONCESSION]
        materialCode:
          type: string
        materialName:
          type: string
        batchNo:
          type: string
        supplierCode:
          type: string
        supplierName:
          type: string
        customerCode:
          type: string
        customerName:
          type: string
        isMandatoryGate:
          type: boolean
        inspectorId:
          type: string
          format: uuid
        inspectorName:
          type: string
        inspectionNotes:
          type: string
        inboundNo:
          type: string
          description: 入库单号（006 来料检验扩展，物理列 `inbound_no`；「采购入库单号」与「入库单号」为同一业务对象）
        inboundDate:
          type: string
          description: 入库日期（006 来料检验扩展，物理列 `inbound_date`）
        specification:
          type: string
          description: 规格型号（物理列 `inspection_orders.specification`）。来源 ERP Ptype.Standard -> `materials.spec_model`；006 新增，迁移 023 按物料主数据回填全部检验类型
        spec:
          type: string
          description: 规格型号只读别名：读侧由 specification 派生，不落库（写侧请用 specification）
        unit:
          type: string
          description: 计量单位
        totalQty:
          type: number
          description: 报检批量总数（物理列 total_qty）；过程检验 = 该工序投产/送检批量，即台账「数量」列
        workOrderNo:
          type: string
          description: MES 生产工单号（007 过程检验 IPQC 扩展）
        blankingLength:
          type: number
          description: 下料/断料长度 mm（007 过程检验 IPQC 扩展）
        operatorName:
          type: string
          description: 工序机台操作员姓名（007）
        operatorId:
          type: string
          description: 工序操作员工号（007）
        equipmentCode:
          type: string
          description: 生产机台设备编号（007）
        equipmentName:
          type: string
          description: 生产设备名称（007）
        threadSpec:
          type: string
          description: 牙纹/螺纹规格（007）
        inspectionTeam:
          type: string
          description: 终检班组（007）
        processStep:
          type: string
          description: 工序名称/阶段（007）
        completedAt:
          type: string
          format: date-time
          description: 检验终判完成时间（007）
        salesOrderNo:
          type: string
          description: 销售出库单号（008 出货检验 OQC 扩展，如 SO-20260706-01）
        dispatchDate:
          type: string
          description: 销售出库日期（008 出货检验 OQC 扩展，如 2026-07-06）
        salesOrderPoNo:
          type: string
          description: 客户采购订单号/合同号（008 出货检验 OQC 扩展，如 PO-A-001）
        erpStatus:
          type: string
          description: ERP 出库单审核状态：待审核 / 已审核 / 已拦截（008 出货检验 OQC 扩展）
        outsourceNo:
          type: string
          description: ERP 委外加工单号（009 委外检验扩展，如 WW-20260706-001）
        processType:
          type: string
          description: 加工类型/工艺分类（009 委外检验扩展，如 镀锌）
        returnDate:
          type: string
          description: 委外件回厂登记日期 YYYY-MM-DD（009 委外检验扩展）
        vendorName:
          type: string
          description: 加工商/外协厂商名称快照（009 委外检验扩展）
        # 030 委外检验录入页业务事实字段（迁移 030，docs/36）：三列均为录入事实，缺省即缺省，绝不推导
        materialGrade:
          type: string
          description: 材质牌号/强度等级（落库 inspection_orders.material_grade，如 10.9级 / 35CrMo）
        techStandard:
          type: string
          description: 执行技术标准与工艺规范（落库 inspection_orders.tech_standard）；制造证书「执行规范」行读该列
        inspectedDate:
          type: string
          description: 检验日期 YYYY-MM-DD（落库 inspection_orders.inspected_date）；为空时读侧才回落 completedAt/createdAt
        # 034 炉批号溯源留痕（迁移 034，docs/47 §3.1 / §3.6）
        furnaceHeatNo:
          type: string
          description: >-
            炉批号（Heat No）：钢材冶炼炉号 / 热处理炉批号（物理列 `furnace_heat_batch_no`，迁移 004 建列、
            034 起有写入路径与归一索引）。出货检验录入该字段即按 docs/47 的三级优先级关联上游检验记录；
            归一后比较、原值落库
        heatSourceType:
          type: string
          readOnly: true
          enum: [OUTSOURCE_HEAT_TREATMENT, IQC_RAW_MATERIAL]
          description: >-
            溯源留痕（物理列 `heat_source_type`）：本单炉批号最终命中的上游来源类型。由服务端在写入炉批号时
            **自行重新解析**后落库，请求体不接受客户端自称来源；炉批号被清空时该留痕一并归零。
            源为 `NONE`（两处均无上游记录）时**不落该值**，字段缺省 —— 故此处枚举只有两级，不含 `NONE`
        heatSourceOrderNo:
          type: string
          readOnly: true
          description: 溯源留痕（物理列 `heat_source_order_no`）：命中来源对应的上游检验单号，与 `heatSourceType` 同生同灭
        planVersionId:
          type: string
          format: uuid
        planSnapshot:
          type: object
          description: 检验单创建时深拷贝固化的方案快照元数据与判定基准
        sampleQty:
          type: number
        passQty:
          type: number
        failQty:
          type: number
        items:
          type: array
          items:
            $ref: '#/components/schemas/InspectionOrderItem'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    InspectionOrderItem:
      type: object
      required: [itemCode, name, metricCategory, dataType, result]
      properties:
        seq:
          type: integer
          description: 单内指标序号（库内 210/210 item 行恒有）
        id:
          type: string
          format: uuid
        itemCode:
          type: string
        name:
          type: string
        metricCategory:
          type: string
          enum: [DIMENSION, APPEARANCE, HARDNESS, COATING_THICKNESS, TENSILE_STRENGTH, MECHANICAL_PERFORMANCE, CHEMICAL_COMPOSITION, TEXT_INTERVAL]
          description: 业务分类维度（尺寸、外观、硬度、镀层膜厚、抗拉强度、综合机械性能、化学成分、文本区间）
        dataType:
          type: string
          enum: [NUMERIC, TEXT, QUALITATIVE]
          description: 判定算法数据维度（数值比较、文本包含/区间解析、定性判定）
        standardText:
          type: string
          description: 标准语 / 判定基准文本（库内 210/210 item 行恒有）
        nominalValue:
          type: number
        upperTolerance:
          type: number
        lowerTolerance:
          type: number
        unit:
          type: string
        sampleSize:
          type: integer
          description: 抽样数（库内 210/210 item 行恒有）
        measuredVal:
          type: number
        measuredText:
          type: string
        result:
          type: string
          enum: [PENDING, PASSED, FAILED, EXEMPT]
          description: 落库单项判定（PENDING 待判定 / PASSED 合格 / FAILED 不合格 / EXEMPT 免检；免检不计入合格率分母）
        isExempt:
          type: boolean
          description: 是否标记为不解检（免检）；库内 210/210 item 行恒有
        isManuallyModified:
          type: boolean
          description: 带出数据是否经过质检员手工修改；库内 210/210 item 行恒有
        defectReason:
          type: string

    CreateInspectionOrderRequest:
      type: object
      required: [inspectionType, materialCode, batchNo, sampleQty]
      properties:
        orderNo:
          type: string
          minLength: 1
          description: >-
            检验单号；省略时由服务端按 {类型前缀}-{YYYYMMDD}-{4位流水号} 规则生成
            （出货检验 OQC_SH 示例见下），显式传入时以其为准（兼容 ERP/MES 外部单号）
          example: OQC-SH-20260706-0001
        inspectionType:
          type: string
          enum: [IQC, IPQC_CT, IPQC_RL, IPQC_FN, OQC_SF, OQC_SH, OQC_HEAT, OQC_BLACK, OQC_ZINC, OQC_NICKEL, OQC_PHOSPH, OQC_DACRO, OQC_MACH]
        materialCode:
          type: string
          minLength: 1
          description: 物料编码（ERP Ptype.UserCode）；服务端按它回查存货档案，为台账补齐物料名称 / 规格型号 / 计量单位
          example: MAT-304SS-05
        materialName:
          type: string
          minLength: 1
          description: >-
            物料名称/品名（ERP Ptype.FullName -> materials.material_name）；
            省略时服务端按 materialCode 从存货档案补齐（补齐失败返回 400 validation-failed）
        batchNo:
          type: string
          minLength: 1
          example: B20231013-01
        supplierCode:
          type: string
        supplierName:
          type: string
        customerCode:
          type: string
        customerName:
          type: string
        sampleQty:
          type: number
          exclusiveMinimum: 0
        isMandatoryGate:
          type: boolean
        totalQty:
          type: number
          minimum: 0
          description: 报检批量总数（落库 inspection_orders.total_qty，过程检验台账「数量」列）
        furnaceHeatNo:
          type: string
          description: 炉批号（支持智能关联溯源）
        inboundNo:
          type: string
          description: 入库单号，来自 ERP 采购入库单 Dlyndx.Number（006 来料检验扩展）
          example: RK-20260706-001
        inboundDate:
          type: string
          description: 入库日期（006 来料检验扩展）
          example: '2026-07-06'
        specification:
          type: string
          description: >-
            规格型号，来自 ERP Ptype.Standard -> `materials.spec_model`（006 来料检验扩展）；
            与 spec 等价但优先级更高，服务端统一收敛到该字段落库；
            省略时按 materialCode 从存货档案补齐（补齐不到则落 NULL，绝不从物料名称猜规格）
          example: Φ5.0mm / 盘圆 / 304HC
        spec:
          type: string
          description: 规格型号的兼容别名：仅在省略 specification 时生效，服务端归一后写入 specification 列
          example: Φ5.0mm / 盘圆 / 304HC
        unit:
          type: string
          description: 计量单位（ERP Unit1 -> materials.unit）；省略时按 materialCode 从存货档案补齐
          example: 件
        inspectorId:
          type: string
          format: uuid
          description: 检验人（员工主数据 id，落库 inspection_orders.inspector_id）：与 inspectorName 可任选其一或同时传入
        inspectorName:
          type: string
          description: 检验人姓名（落库 inspection_orders.inspector_name，即过程检验台账「检验人」列）；缺省时由读侧按 inspector_id 从员工主数据补齐，绝不推导假值
          example: 刘芳
        workOrderNo:
          type: string
          description: MES 生产工单号（007 过程检验扩展）
        blankingLength:
          type: number
          description: 断料/下料长度 mm（007 过程检验扩展）
        operatorName:
          type: string
          description: 机台作业员姓名（007 过程检验扩展，工序执行人；**不是**当前登录操作人）
        operatorId:
          type: string
          description: 操作员工号（007 过程检验扩展）
        equipmentCode:
          type: string
          description: 设备编号（007 过程检验扩展）
        equipmentName:
          type: string
          description: 设备名称（007 过程检验扩展）
        threadSpec:
          type: string
          description: 牙纹/螺纹规格（007 过程检验扩展）
        inspectionTeam:
          type: string
          description: 终检组/检验班组（007 过程检验扩展）
        processStep:
          type: string
          description: 工序阶段/工序名称（007 过程检验扩展）
        salesOrderNo:
          type: string
          description: 销售出库单号（008 出货检验扩展）
        dispatchDate:
          type: string
          description: 出库日期 YYYY-MM-DD（008 出货检验扩展）
        salesOrderPoNo:
          type: string
          description: 客户采购订单号（008 出货检验扩展）
        erpStatus:
          type: string
          description: ERP 出库单审核状态：待审核 / 已审核 / 已拦截（008 出货检验扩展）
        outsourceNo:
          type: string
          description: ERP 委外加工单号（009 委外检验扩展）
        processType:
          type: string
          description: 加工类型/工艺分类（009 委外检验扩展）
        returnDate:
          type: string
          description: 委外件回厂登记日期 YYYY-MM-DD（009 委外检验扩展）
        vendorName:
          type: string
          description: 加工商/外协厂商名称（009 委外检验扩展）
        # 030 委外检验录入页业务事实字段（迁移 030，docs/36）：空串按「未提供」归一，不落 NULL 覆盖既有值
        materialGrade:
          type: string
          description: 材质牌号/强度等级（落库 inspection_orders.material_grade）
        techStandard:
          type: string
          description: 执行技术标准与工艺规范（落库 inspection_orders.tech_standard）
        inspectedDate:
          type: string
          description: 检验日期 YYYY-MM-DD（落库 inspection_orders.inspected_date）
        completedAt:
          type: string
          description: 台账「完成时间」列：该工序报工/报检登记时间；终判完成时由状态流转刷新
        planVersionId:
          type: string
          format: uuid
          description: >-
            指定的质检方案版本行 UUID；显式传入时必须真实存在（否则 404，禁止静默降级为其它方案）；
            省略时服务端按「物料编码 + 检验类型」自动匹配已启用方案，匹配不到返回 400 inspection-plan-not-found。
            口径见 docs/17-检验录入界面说明与质检方案匹配口径.md §7
        transferOverride:
          $ref: '#/components/schemas/TransferOverrideInput'

    TransferOverrideInput:
      type: object
      required: [reason, approverId]
      description: >-
        质量负责人传递门禁特批豁免直接输入（docs/48 §8 / TBD-09）：随 `POST /inspections`
        携带，允许绕过上游未合格的 422 阻断；审批人须具备 QA_MANAGER / ADMIN 权限，全部要素记入审计。
      properties:
        reason:
          type: string
          minLength: 5
          description: 豁免原因（必填，至少 5 字，记入审计）
          example: 客户紧急试制，质量总监李工特批放行
        approverId:
          type: string
          format: uuid
          description: 审批人 UUID（须具备 QA_MANAGER 或 ADMIN 权限）
        approverName:
          type: string
          description: 审批人姓名快照
        approvalDocNo:
          type: string
          description: 书面特批单据编号
          example: QA-OVR-20260924-001
        ticketId:
          type: string
          format: uuid
          description: 关联的已审批豁免工单 ID（若走完审批流）
        ticketNo:
          type: string
          description: 关联的已审批豁免工单编号（如 TOT-20260924-0001）

