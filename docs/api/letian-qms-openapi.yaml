      properties:
        id:
          type: string
          format: uuid
        seq:
          type: integer
          description: 指标项序号
        itemCode:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        dataType:
          type: string
          enum: [NUMERIC, TEXT, QUALITATIVE]
        metricCategory:
          type: string
          description: 检验类别（页面「检验类别」列的取值来源）
          enum: [DIMENSION, APPEARANCE, HARDNESS, COATING_THICKNESS, TENSILE_STRENGTH, MECHANICAL_PERFORMANCE, CHEMICAL_COMPOSITION, TEXT_INTERVAL]
        standardText:
          type: string
        acceptableValues:
