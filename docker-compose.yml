services:
  postgres:
    image: postgres:14-alpine
    container_name: letian-qms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-letian_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-letian_secure_pass_2026}
      POSTGRES_DB: ${DB_NAME:-letian_qms_db}
      TZ: UTC
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-letian_user} -d ${DB_NAME:-letian_qms_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
